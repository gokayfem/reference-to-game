name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r skills/reference-to-game/scripts/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/runtime.test.mjs
      - run: python tests/check_repo.py
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [jungle-jetboat-jump, jellyworks, petal-pals, sunshine-train-battle]
    defaults:
      run:
        working-directory: examples/${{ matrix.game }}/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/${{ matrix.game }}/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
